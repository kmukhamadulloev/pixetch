<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="./styles/styles.css">
</head> 
<body>
    <div class="toolbar">
        <div class="tool-group">
            <button id="pencil" class="tool active"><span class="fas fa-pencil"></span></button>
            <button id="brush" class="tool"><span class="fas fa-brush"></span></button>
            <button id="fill" class="tool"><span class="fas fa-bucket"></span></button>
            <button id="eraser" class="tool"><span class="fas fa-eraser"></span></button>
        </div>
        <div class="tool-group">
            <input type="color" class="color-picker" id="color-picker-0">
            <input type="color" class="color-picker" id="color-picker-1">
            <input type="color" class="color-picker" id="color-picker-2">
            <input type="color" class="color-picker" id="color-picker-3">
            <input type="color" class="color-picker" id="color-picker-4">
            <input type="color" class="color-picker" id="color-picker-5">
            <input type="color" class="color-picker" id="color-picker-6">
            <input type="color" class="color-picker" id="color-picker-7">
            <input type="color" class="color-picker" id="color-picker-8">
            <input type="color" class="color-picker" id="color-picker-9">
        </div>
        <div class="tool-group">
            <button id="undo" class="tool"><span class="fas fa-undo"></span></button>
            <button id="redo" class="tool"><span class="fas fa-redo"></span></button>
            <button id="export" class="tool"><span class="fas fa-download"></span></button>
            <button id="config" class="tool"><span class="fas fa-cog"></span></button>
        </div>
    </div>
    <div class="layers-panel">
        <div class="layers-header">
            <h3>Layers</h3>
            <div class="layers-header-actions">
                <button id="merge-layer" class="tool" title="Merge active layer down"><span class="fas fa-layer-group"></span></button>
                <button id="add-layer" class="tool" title="Add layer"><span class="fas fa-plus"></span></button>
            </div>
        </div>
        <div class="layers-list" id="layers-list">
            <!-- Layers will be added here dynamically -->
        </div>
    </div>

    <div class="history-panel">
        <div class="history-header">
            <h3>History</h3>
        </div>
        <div id="history-list" class="history-list"></div>
    </div>

    <div class="canvas-container">
        <!-- Canvases will be created dynamically -->
    </div>

    <!-- Layer Name Edit Modal -->
    <div id="layer-name-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Layer Name</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <input type="text" id="layer-name-input" placeholder="Enter layer name">
            </div>
            <div class="modal-footer">
                <button id="cancel-rename" class="btn btn-secondary">Cancel</button>
                <button id="save-rename" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>

    <!-- Configuration Modal -->
    <div id="config-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Canvas Configuration</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="config-group">
                    <label for="pixel-size">Pixel Size:</label>
                    <input type="number" id="pixel-size" min="1" max="50" value="10">
                </div>
                <div class="config-group">
                    <label for="canvas-width">Canvas Width:</label>
                    <input type="number" id="canvas-width" min="1" max="2000" value="350">
                </div>
                <div class="config-group">
                    <label for="canvas-height">Canvas Height:</label>
                    <input type="number" id="canvas-height" min="1" max="2000" value="350">
                </div>
                <div class="config-group">
                    <label>Resize Anchor:</label>
                    <div id="resize-anchor" class="anchor-grid" aria-label="Resize anchor selector">
                        <button type="button" class="anchor-point" data-anchor="top-left" aria-label="Top left"></button>
                        <button type="button" class="anchor-point" data-anchor="top-center" aria-label="Top center"></button>
                        <button type="button" class="anchor-point" data-anchor="top-right" aria-label="Top right"></button>
                        <button type="button" class="anchor-point" data-anchor="middle-left" aria-label="Middle left"></button>
                        <button type="button" class="anchor-point active" data-anchor="middle-center" aria-label="Middle center"></button>
                        <button type="button" class="anchor-point" data-anchor="middle-right" aria-label="Middle right"></button>
                        <button type="button" class="anchor-point" data-anchor="bottom-left" aria-label="Bottom left"></button>
                        <button type="button" class="anchor-point" data-anchor="bottom-center" aria-label="Bottom center"></button>
                        <button type="button" class="anchor-point" data-anchor="bottom-right" aria-label="Bottom right"></button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancel-config" class="btn btn-secondary">Cancel</button>
                <button id="save-config" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>

    <div id="color-edit-modal" class="modal">
        <div class="modal-content modal-content-color">
            <div class="modal-header">
                <h3>Edit Palette Color</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body color-modal-body">
                <div class="color-picker-layout">
                    <div class="color-surface-wrap">
                        <div id="color-surface" class="color-surface" aria-label="Color surface">
                            <div id="color-surface-cursor" class="color-surface-cursor"></div>
                        </div>
                    </div>
                    <div class="color-sidebar">
                        <div class="color-preview-grid">
                            <div class="color-preview-card">
                                <span>Current</span>
                                <div id="color-preview-current" class="color-preview-swatch"></div>
                            </div>
                            <div class="color-preview-card">
                                <span>New</span>
                                <div id="color-preview-next" class="color-preview-swatch"></div>
                            </div>
                        </div>
                        <div class="color-slider-group">
                            <label for="color-hue">Hue</label>
                            <input type="range" id="color-hue" min="0" max="360" value="0">
                        </div>
                        <div class="color-slider-group">
                            <label for="color-alpha">Alpha</label>
                            <input type="range" id="color-alpha" min="0" max="100" value="100">
                        </div>
                    </div>
                </div>
                <div class="color-field-grid">
                    <label class="color-field">
                        <span>Hex</span>
                        <input type="text" id="color-hex" maxlength="7" value="#000000">
                    </label>
                    <label class="color-field">
                        <span>Alpha</span>
                        <input type="number" id="color-alpha-input" min="0" max="255" value="255">
                    </label>
                    <label class="color-field">
                        <span>R</span>
                        <input type="number" id="color-r" min="0" max="255" value="0">
                    </label>
                    <label class="color-field">
                        <span>G</span>
                        <input type="number" id="color-g" min="0" max="255" value="0">
                    </label>
                    <label class="color-field">
                        <span>B</span>
                        <input type="number" id="color-b" min="0" max="255" value="0">
                    </label>
                    <label class="color-field">
                        <span>Opacity %</span>
                        <input type="number" id="color-opacity-input" min="0" max="100" value="100">
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancel-color-edit" class="btn btn-secondary">Cancel</button>
                <button id="save-color-edit" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>

    <script src="./scripts/editor.js"></script>
</body>
</html>
